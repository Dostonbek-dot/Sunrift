<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Sunrift</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1020">
    <!-- v8.1 Add to Home Screen: opens fullscreen like an app (iPhone has no fullscreen API for pages) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sunrift">
    <style>
      @font-face { font-family: "Chakra Petch"; src: url("TemplateData/ChakraPetch-Bold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Chakra Petch"; src: url("TemplateData/ChakraPetch-Regular.ttf") format("truetype"); font-weight: 400; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1020; }
      /* iPhone Safari ignores user-scalable=no: quick double taps (e.g. the roll buttons) were eaten as double-tap zoom */
      html, body, #frame, #unity-canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* v8.1: Russian loader words — Cyrillic-only cut of Tektur (the game's RU font), ~8 KB each, loads only when needed */
      @font-face { font-family: "Tektur Cyr"; src: url("TemplateData/Tektur-Cyr-Bold.woff") format("woff"); font-weight: 700; unicode-range: U+0400-04FF, U+00AB, U+00BB, U+2026, U+2014; }
      @font-face { font-family: "Tektur Cyr"; src: url("TemplateData/Tektur-Cyr-Regular.woff") format("woff"); font-weight: 400; unicode-range: U+0400-04FF, U+00AB, U+00BB, U+2026, U+2014; }
      body { font-family: "Chakra Petch", "Tektur Cyr", system-ui, sans-serif; color: #f4f1ea; }
      #frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #120a1c; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #120a1c; outline: none; }
      /* v8 phones / tablets: fill the whole screen (the game lays out for wide phone aspects; a 16:9 letterbox shrank the
         touch UI by ~20 % and left black side bars) */
      /* v8.7: = the VISIBLE area (fixed + inset 0), not 100vh — vh counts the browser bars as hidden, so with Chrome's URL bar /
         Telegram's header / Safari's tab bar showing the canvas overflowed and the top + bottom of the game were cut off.
         Padding = the notch / camera cutout / home-indicator insets (viewport-fit=cover): the game never draws under them. */
      @media (pointer: coarse) {
        html, body { overscroll-behavior: none; }
        #frame { position: fixed; inset: 0; left: 0; top: 0; transform: none; width: auto; height: auto; box-sizing: border-box; padding: 0;
                 padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 background: radial-gradient(ellipse at 50% 60%, rgba(26,16,32,.15) 0%, rgba(11,6,18,.75) 100%), url("TemplateData/bg.jpg") center / cover, #1a1020;
                 transition: opacity .5s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      .title { font-weight: 700; font-size: clamp(28px, 6vw, 84px); letter-spacing: .18em; padding-left: .18em; color: #fff;
               text-shadow: 0 4px 24px rgba(255, 140, 80, .25); }
      .logo { width: min(70vw, 900px); max-height: 38vh; object-fit: contain; margin-bottom: 38px;
              filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); opacity: 0; }
      .logo.ready { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
      .accent { width: 120px; height: 4px; border-radius: 2px; background: #3ef2ff; margin: 18px 0 34px; box-shadow: 0 0 14px #3ef2ff88; }
      .bar { width: min(420px, 60vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #3ef2ff; border-radius: 3px; box-shadow: 0 0 10px #3ef2ff; transition: width .15s linear; }
      #pct { margin-top: 12px; font-size: 13px; letter-spacing: .3em; opacity: .55; }
      #inapp { display: none; margin-top: 22px; font-size: 12px; letter-spacing: .12em; color: #FFD27A; opacity: .9; text-align: center; padding: 0 20px; }
      /* sits just left of the in-game speaker button (UI 54 px at 1920×1080, centre 62/58 from the corner) */
      #fs { position: absolute; right: calc(9.54vh + 6px); bottom: max(14px, calc(5.37vh - 20px)); width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25);
            background: rgba(18,10,28,.55); color: #fff; cursor: pointer; opacity: .55; transition: opacity .2s; padding: 0; }
      #fs:hover { opacity: 1; }
      @media (pointer: coarse) { #fs { display: none; } }
      #fs svg { width: 20px; height: 20px; display: block; margin: auto; }
      #error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
               background: #0b0612; color: #ff8a7a; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="loading">
        <img class="logo" src="TemplateData/logo.png" alt="" onload="this.classList.add('ready')">
        <div class="bar"><div id="fill"></div></div>
        <div id="pct">LOADING</div>
        <div id="inapp"></div>
      </div>
      <button id="fs" title="Fullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <div id="error"></div>
    </div>
    <script>

      // This swaps a 1x1 depth texture (compare on, depth 1 = fully lit) into those slots for just that draw.

        if (/[?&]noshim\b/.test(location.search)) return;   // test switch: check the in-build fix without this safety net
        var getCtx = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, attrs) {

            .forEach(function (f) { DEPTH[f] = 1; });
          var o = {}; ["activeTexture", "bindTexture", "texStorage2D", "texImage2D", "linkProgram", "useProgram", "uniform1i",
                       "drawElements", "drawArrays", "drawElementsInstanced", "drawArraysInstanced", "drawRangeElements"]
            .forEach(function (k) { o[k] = gl[k].bind(gl); });

            gl.texParameteri(TEX2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(TEX2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(TEX2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(TEX2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
            o.bindTexture(TEX2D, prev || null);

          gl.bindTexture = function (tgt, t) { if (tgt === TEX2D) bound[active] = t; return o.bindTexture(tgt, t); };
          gl.texStorage2D = function (tgt, l, f, w, h) { var t = bound[active]; if (tgt === TEX2D && t) t.__srFmt = f; return o.texStorage2D(tgt, l, f, w, h); };
          gl.texImage2D = function (tgt, l, f) { var t = bound[active]; if (tgt === TEX2D && l === 0 && t) t.__srFmt = f; return o.texImage2D.apply(null, arguments); };
          gl.linkProgram = function (p) {

                p.__srLocs = locs; p.__srUnits = null;

          };
          gl.useProgram = function (p) { prog = p; return o.useProgram(p); };
          gl.uniform1i = function (loc, v) { if (prog) prog.__srUnits = null; return o.uniform1i(loc, v); };
          function wrapDraw(k) {
            gl[k] = function () {
              var p = prog, swapped = null;
              if (p && p.__srLocs && p.__srLocs.length) {
                if (!p.__srUnits) p.__srUnits = p.__srLocs.map(function (l) { return gl.getUniform(p, l); });
                for (var i = 0; i < p.__srUnits.length; i++) {
                  var u = p.__srUnits[i], t = bound[u];
                  if (t && t.__srFmt && !DEPTH[t.__srFmt]) {
                    if (!dummy) dummy = makeDummy();
                    o.activeTexture(gl.TEXTURE0 + u); o.bindTexture(TEX2D, dummy);
                    (swapped = swapped || []).push(u);

                if (swapped) o.activeTexture(gl.TEXTURE0 + active);

              if (swapped) {
                for (var j = 0; j < swapped.length; j++) { o.activeTexture(gl.TEXTURE0 + swapped[j]); o.bindTexture(TEX2D, bound[swapped[j]]); }

    <script src="Build/web1.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.querySelector("#fill"), pct = document.querySelector("#pct");
      // v8.1: loader words follow the browser language (the in-game language lives in the save, which isn't loaded yet)
      var RU = /^ru/i.test(navigator.language || "");
      var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent || ""), BROWSER = IOS ? "Safari" : "Chrome";
      var T = RU ? { load: "ЗАГРУЗКА", retry: "ПОВТОР…", fail: "ЗАГРУЗКА ПРЕРВАНА", start: "ЗАПУСК…",
                     failHint: "Проверьте подключение (лучше через Wi-Fi) и нажмите, чтобы попробовать снова.",
                     nogl: "3D-ГРАФИКА НЕДОСТУПНА",
                     noglHint: "Этот браузер не смог запустить 3D-графику игры (WebGL). Откройте ссылку в " + BROWSER + ".",
                     stall: "ИГРА НЕ ЗАПУСТИЛАСЬ",
                     stallHint: "Нажмите, чтобы попробовать снова. Если экран останется чёрным, откройте ссылку в " + BROWSER + ".",
                     lost: "ГРАФИКА ОСТАНОВЛЕНА",
                     lostHint: "Устройству не хватило памяти. Нажмите, чтобы перезапустить (прогресс сохранён). Лучше всего игра идёт в " + BROWSER + ".",
                     tap: "Нажмите, чтобы попробовать снова" }
                 : { load: "LOADING", retry: "RETRYING", fail: "DOWNLOAD INTERRUPTED", start: "STARTING…",
                     failHint: "Check your connection (Wi-Fi works best) and tap to try again.",
                     nogl: "3D GRAPHICS UNAVAILABLE",
                     noglHint: "This browser couldn't start the game's 3D graphics (WebGL). Open the link in " + BROWSER + ".",
                     stall: "THE GAME DIDN'T START",
                     stallHint: "Tap to try again. If the screen stays black, open the link in " + BROWSER + ".",
                     lost: "GRAPHICS STOPPED",
                     lostHint: "The device ran out of memory. Tap to restart (your progress is saved). The game runs best in " + BROWSER + ".",
                     tap: "Tap to try again" };
      pct.textContent = T.load;
      // v8.1 weak phones: one full-screen message panel (download failed / no WebGL / never drew / graphics lost / crashed).
      // Tap = reload (unless the panel says otherwise). Hidden again if the game draws after all.
      var panelKind = "";
      function showPanel(kind, title, hint, detail, onTap) {
        var e = document.querySelector("#error");
        panelKind = kind;
        e.style.display = "flex"; e.style.flexDirection = "column"; e.style.cursor = "pointer";
        e.innerHTML = '<div style="font-size:20px;letter-spacing:.12em;color:#f4f1ea"></div>'
          + '<div style="margin-top:10px;opacity:.75;max-width:560px;line-height:1.45"></div>'
          + '<div style="margin-top:22px;font-size:11px;opacity:.35;max-width:560px;word-break:break-word"></div>';
        e.children[0].textContent = title; e.children[1].textContent = hint;
        e.lastChild.textContent = detail ? String(detail).slice(0, 300) : "";
        e.onclick = onTap || function () {
          try { sessionStorage.removeItem("sr_retry"); } catch (x) {}
          location.reload();
        };
      }
      function hidePanel(kind) {
        if (panelKind !== kind) return;
        panelKind = "";
        document.querySelector("#error").style.display = "none";
      }
      // v8.1: the loader stays up until the game has REALLY drawn (WebBoot.cs → SunriftWeb.jslib SunriftFirstFrame), not just until
      // createUnityInstance resolves — weak phones can spend seconds compiling shaders, or end up with a dead WebGL context.
      var revealed = false, stallTimer = 0;
      function reveal() {
        if (revealed) return;
        revealed = true;
        clearTimeout(stallTimer);
        hidePanel("stall"); hidePanel("dlstall");   // v8.7: the download came back after all
        // v8.7: ask the browser to keep the save (IndexedDB) — best effort, once. Chrome grants it silently to engaged sites,
        // Safari 17+ by its own rules (else a week without a visit can wipe it). Not Firefox: it would show a permission prompt.
        try {
          if (navigator.storage && navigator.storage.persist && !/Firefox\//.test(navigator.userAgent || ""))
            navigator.storage.persisted().then(function (on) { if (!on) return navigator.storage.persist(); }).catch(function () {});
        } catch (x) {}

        requestAnimationFrame(function () { requestAnimationFrame(function () { document.querySelector("#loading").classList.add("done"); }); });
      }
      window.addEventListener("sunrift-first-frame", reveal);
      function armStall(ms) {
        clearTimeout(stallTimer);
        stallTimer = setTimeout(function () { if (!revealed && !panelKind) showPanel("stall", T.stall, T.stallHint, ""); }, ms);
      }
      // a phone can drop the game's graphics (low memory, long time in the background) → never a silent black screen
      canvas.addEventListener("webglcontextlost", function (ev) {
        console.warn("[Sunrift] WebGL context lost");
        showPanel("lost", T.lost, T.lostHint, "");
      }, false);
      // v8.1: in-app browsers (Telegram / Instagram / Facebook WebViews) give games little memory → black screens on weaker
      // phones. One short tip on the loader, only there.
      (function () {
        var ua = navigator.userAgent || "", ios = /iPhone|iPad|iPod/.test(ua);
        var inApp = /Telegram|Instagram|FBAN|FBAV|Line\//i.test(ua) || /; wv\)/.test(ua) || (ios && !/Safari\//.test(ua));
        if (!inApp) return;
        var ru = RU, browser = ios ? "Safari" : "Chrome", menu = ios ? "⋯" : "⋮";   // v8.7: iOS apps use a horizontal ⋯ menu
        var el = document.querySelector("#inapp");
        el.textContent = ru ? menu + " → «Открыть в " + browser + "» — игра пойдёт плавнее" : menu + " → Open in " + browser + " for smoother play";
        el.style.display = "block";
      })();
      // v8.7: download watchdog — a mobile connection that stalls without closing (cell handover) used to freeze the bar forever
      // (the stall timer only starts at 100 %). No progress for 45 s while the page is visible → the DOWNLOAD INTERRUPTED panel.
      var lastP = -1, lastPT = Date.now();

        if (document.hidden || panelKind || Date.now() - lastPT < 45000) return;
        clearInterval(dlWatch);

        return Math.min(d, 2);                                                            // tablets
      }
      createUnityInstance(canvas, {
        // hidden "?selftest" → the built-in autopilot smoke test (separate test save) for automated verification
        // hidden "?touchtest" → the v8 touch test (finger-drag steering vs the autopilot, buttons, swipe) on this canvas
        arguments: /[?&]selftest\b/.test(location.search) ? ["-autotest", "25", "-seed", "12345"]
          : /[?&]touchtest\b/.test(location.search) ? ["-v8touch", "-seed", "12345", "-timescale", "1", "-savekey", "webtouch"]
          : /[?&]v81web\b/.test(location.search) ? ["-v81web", "-seed", "12345", "-timescale", "1", "-savekey", "webv81"] : [],
        dataUrl: "Build/web1.data.unityweb",
        frameworkUrl: "Build/web1.framework.js.unityweb",
        codeUrl: "Build/web1.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Doston",
        productName: "Sunrift",
        productVersion: "1.0.0",
        // pixel ratio: laptops 1.25 (fill rate); phones up to 2.5 (v8.6 — before, ≤ 590 px tall, stretched ~2× = blurry; the
        // game now detects a phone in CSS px and draws the 3D at a pixel budget, GameSettings); tablets up to 2. Re-applied on
        // resize / rotation (see below).
        devicePixelRatio: srPixelRatio(),
        // v8.1: crashes while running (out of memory, wasm abort) used to raise an English developer alert() — which Telegram's
        // in-app browser swallows → black screen. Show the localized panel instead; anything else is only logged.
        errorHandler: function (msg) {
          var m = String(msg || "");
          console.error("[Sunrift] " + m);
          // v8.7: browser DOM errors (a cancelled share sheet = "AbortError", a refused clipboard = "NotAllowedError", …) reach this
          // handler through Unity's unhandledrejection listener — never the crash panel ("abort" used to match AbortError)
          if (/\b(AbortError|NotAllowedError|InvalidStateError|NotSupportedError|SecurityError|NotFoundError|DataError)\b/.test(m)) return true;
          if (/memory|\babort\(|Aborted\(|RuntimeError|unreachable|out of bounds|WebGL/i.test(m) && !panelKind) showPanel("crash", T.lost, T.lostHint, m);
          return true;
        },
      }, function (p) {
        if (p !== lastP) { lastP = p; lastPT = Date.now(); }
        fill.style.width = (100 * p) + "%";
        pct.textContent = p >= 1 ? T.start : T.load + "  " + Math.round(100 * p) + "%";
        if (p >= 1 && !stallTimer) armStall(60000);   // downloaded; wasm compile + start can be slow on weak phones
      }).then(function (unityInstance) {
        try { sessionStorage.removeItem("sr_retry"); } catch (x) {}
        var keepRatio = function () { if (unityInstance.Module) unityInstance.Module.devicePixelRatio = srPixelRatio(); };
        window.addEventListener("resize", keepRatio); window.addEventListener("orientationchange", keepRatio);
        pct.textContent = T.start;
        if (window.__srFirstFrame) reveal();
        else armStall(30000);   // no drawn frame 30 s after start-up → message + tap to retry (hidden again if it draws later)
        canvas.focus();
        document.querySelector("#fs").onclick = function () { unityInstance.SetFullscreen(1); };
        // phones / tablets: the corner button sat on top of the in-game FIRE and sound buttons → hide it once the game runs and
        // go fullscreen on the first tap instead (Android; iPhone Safari has no fullscreen API, so nothing happens there)
        // v8.7: pause the run from the page (Core/WebBoot.cs PagePause → the same pause menu as a focus loss). Runs inside the
        // browser event, so the run is already paused on the first frame back — Unity's own blur → OnApplicationFocus waits for a frame.
        var pauseRun = function () { try { unityInstance.SendMessage("WebBoot", "PagePause"); } catch (x) {} };
        document.addEventListener("visibilitychange", function () { if (document.hidden) pauseRun(); });

          document.querySelector("#fs").style.display = "none";
          var isFull = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
          var goFull = function () {
            window.removeEventListener("touchend", goFull, true);

            }

          window.addEventListener("touchend", goFull, true);
          // v8.7: entering fullscreen → lock landscape (Android Chrome; a phone held flat no longer flips to portrait = pause);
          // leaving it (back / swipe) → the next tap goes fullscreen again (before: once per visit, then clipped by the URL bar)
          var onFullChange = function () {
            if (isFull()) {
              try { if (screen.orientation && screen.orientation.lock) { var l = screen.orientation.lock("landscape"); if (l && l.catch) l.catch(function () {}); } } catch (x) {}
            } else {
              window.removeEventListener("touchend", goFull, true);
              window.addEventListener("touchend", goFull, true);
            }
          };
          document.addEventListener("fullscreenchange", onFullChange); document.addEventListener("webkitfullscreenchange", onFullChange);
          // v8.7: Android back / iOS edge-swipe back: one guard entry (pushed inside a tap, so browsers keep it) → the first back
          // pauses the run instead of leaving the page; the next back leaves as normal (re-armed only by a later tap: never a trap)
          var guarded = false;
          var armGuard = function () {
            if (guarded) return;
            try { history.pushState({ srGuard: 1 }, "", location.href); guarded = true; } catch (x) {}
          };
          window.addEventListener("touchend", armGuard, true);
          window.addEventListener("popstate", function () { if (guarded) { guarded = false; pauseRun(); } });
        }
        canvas.addEventListener("pointerdown", function () { canvas.focus(); });
      }).catch(function (message) {
        // v8.1: no WebGL (2) in this browser (Unity's loader checks before downloading) → say so in the player's language;
        // retrying / clearing the download cache can't help here
        if (/WebGL/i.test(String(message))) {
          clearTimeout(stallTimer);
          showPanel("nogl", T.nogl, T.noglHint, message);
          return;
        }
        // a dropped connection (common on phones) leaves a cut-off download in the loader cache → every reload fails.
        // Drop only the download cache (never /idbfs = the save), then retry by itself twice before asking the player.
        function clearDownloads() {
          try { indexedDB.deleteDatabase("UnityCache"); } catch (x) {}
          try { if (window.caches) caches.delete("UnityCache"); } catch (x) {}
        }
        var tries = 0;
        try { tries = +(sessionStorage.getItem("sr_retry") || 0); } catch (x) {}
        clearDownloads();
        if (tries < 2) {
          try { sessionStorage.setItem("sr_retry", tries + 1); } catch (x) {}
          pct.textContent = T.retry;
          setTimeout(function () { location.reload(); }, 800);
          return;
        }
        clearTimeout(stallTimer);
        showPanel("fail", T.fail, T.failHint, message);
      });
    </script>
  </body>
</html>
